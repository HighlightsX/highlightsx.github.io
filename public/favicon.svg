<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- The header logo, on its own tile: a browser tab has no page background,
       and the light ink would vanish against a light one. Colours are the dark
       theme's literals, since a favicon cannot read the CSS variables. -->
