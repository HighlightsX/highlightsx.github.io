  <g transform="translate(0 1) scale(0.94) translate(1.5 1.5)">
    <rect x="8" y="14" width="32" height="26" rx="6" fill="#e8eaf2" />
    <rect x="13" y="19" width="22" height="16" rx="3" fill="#101219" />
    <path d="M17 30l4.5-5 3.5 3.5 5-6.5" stroke="#7c5cff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="30" cy="22" r="2.2" fill="#22d3ee" />
    <path d="M24 4l1.9 4.1 4.1.6-3 3 .7 4.3-3.7-2.1-3.7 2.1.7-4.3-3-3 4.1-.6Z" fill="#7c5cff" />
  </g>
</svg>
