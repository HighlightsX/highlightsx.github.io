name: Build and deploy

# Two triggers, one pipeline:
#   push    - ship what was just written
#   cron    - drain the publishing queue. The site is static, so a future-dated
#             post only appears when something rebuilds.
# 06:00 UTC is 09:00 in Israel in summer, 08:00 in winter. The hour does not
# matter - what publishes a post is the calendar date, and both are well past
# midnight local. No local-time guard: GitHub starts scheduled jobs hours late
# (17:00 local was normal), and a guard that insists on a morning window turns
# every late run into a silent skip.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: # publish by hand from the Actions tab, any time

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one halfway: a half-uploaded
# artifact is a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
